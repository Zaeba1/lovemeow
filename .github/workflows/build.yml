name: Build LovelyKent APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP="$GITHUB_WORKSPACE/LovelyKent-updated.zip"
          DEST="$RUNNER_TEMP/lovelykent"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: LovelyKent-updated.zip not found"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          SETTINGS=$(find "$DEST" -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found in ZIP"
            find "$DEST" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/LovelyKent.apk"
          ls -lh "$GITHUB_WORKSPACE/release/LovelyKent.apk"

      - name: Upload LovelyKent APK
        uses: actions/upload-artifact@v4
        with:
          name: LovelyKent-APK
          path: release/LovelyKent.apk
          if-no-files-found: error
          retention-days: 14
