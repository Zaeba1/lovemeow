name: Build LovelyKent APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 4 \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Locate Gradle project
        id: project
        run: |
          FILE=$(find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "No Gradle project found!"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Prepare APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/LovelyKent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LovelyKent-APK
          path: release/LovelyKent.apk
          if-no-files-found: error
          retention-days: 14
